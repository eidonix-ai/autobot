{{define "content"}}
<h1>Your account</h1>
<section class="panel">
  <p><strong>{{.Me.Name}}</strong> <span class="muted">{{.Me.Username}}</span>, {{if .Me.IsAdmin}}admin{{else}}regular user{{end}}</p>
  <p>Workspaces:
  {{if .Me.IsAdmin}}all, as an admin{{else}}{{range $i, $w := .Workspaces}}{{if $i}}, {{end}}<a href="{{$w.Path}}">{{$w.Name}}</a>{{else}}<span class="muted">none yet</span>{{end}}{{end}}</p>
</section>

<section class="panel">
<h2>Change your password</h2>
<form method="post" action="/account/password" class="stack">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="username" value="{{.Me.Username}}" autocomplete="username">
  <label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
  <label>New password <input type="password" name="new" required minlength="8" autocomplete="new-password"></label>
  <label>New password again <input type="password" name="confirm" required minlength="8" autocomplete="new-password"></label>
  <button>Change password</button>
</form>
</section>
{{end}}
