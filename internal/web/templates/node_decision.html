{{define "content"}}
<div class="modal-head"><h2>{{.Type.Label}}</h2><button class="close" type="button" data-close aria-label="Close">✕</button></div>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="{{.Action}}" class="stack wide node-form step-form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="version" value="">
  <div class="row">
    <label>Name <input name="name" value="{{.Name}}" maxlength="60" required autocomplete="off"></label>
    <label>Decision model
      <select name="model" required>
        {{if not .Models}}<option value="">No decision models are assigned</option>{{end}}
        {{range .Models}}<option value="{{.Value}}"{{if .Selected}} selected{{end}}>{{.Label}}</option>{{end}}
      </select></label>
  </div>
  {{template "tagline" .}}
  <label>Context <textarea name="context" rows="4" class="code" spellcheck="false">{{.S.Context}}</textarea></label>
  <label>Question <textarea name="question" rows="2" spellcheck="false" required>{{.S.Question}}</textarea></label>
  {{template "tags" .}}
  <label><span class="lbl">Choices, one per line as name: description <span class="info" tabindex="0" data-tip="Each choice is one output of the block on the canvas.">ⓘ</span></span>
    <textarea name="choices" rows="4" class="code" spellcheck="false" required>{{.S.ChoiceLines}}</textarea></label>
  <div class="row">
    <label>Output
      <select name="output">
        <option value="decision"{{if eq .S.Output "decision"}} selected{{end}}>The decision only</option>
        <option value="probabilities"{{if eq .S.Output "probabilities"}} selected{{end}}>The decision and each choice's probability</option>
      </select></label>
    </div>
  {{if ne .Kind "discord"}}
  <label class="check"><input type="checkbox" name="case_entry"{{if .S.WritesToCase}} checked{{end}}> Write to the case file <span class="info" tabindex="0" data-tip="Adds this step's result to the case file when it finishes.">ⓘ</span></label>
  {{end}}
  <div class="row"><button>Save</button><button type="button" class="secondary" data-close>Cancel</button></div>
</form>
{{end}}
