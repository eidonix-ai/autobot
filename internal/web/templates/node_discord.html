{{define "content"}}
<div class="modal-head"><h2>{{.Type.Label}}</h2><button class="close" type="button" data-close aria-label="Close">✕</button></div>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="{{.Action}}" class="stack wide node-form step-form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="version" value="">
  <div class="row">
    <label>Name <input name="name" value="{{.Name}}" maxlength="60" required autocomplete="off"></label>
    <label>Channel
      <select name="channel" required>
        {{if not .Channels}}<option value="">No channels: add one in the workspace's Settings</option>{{end}}
        {{range .Channels}}<option value="{{.ID}}"{{if eq $.S.Channel .ID}} selected{{end}}>#{{.Name}}</option>{{end}}
      </select></label>
  </div>
  <label><span class="lbl">Message <span class="info" tabindex="0" data-tip="Discord Markdown. Mentions never ping anyone. A message over 2,000 characters is posted as its beginning, with the whole text attached.">ⓘ</span></span>
    <textarea name="message" rows="6" class="code" spellcheck="false" required>{{.S.Message}}</textarea></label>
  {{template "tags" .}}
  <div class="row"><button>Save</button><button type="button" class="secondary" data-close>Cancel</button></div>
</form>
{{end}}
