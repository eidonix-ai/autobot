{{define "content"}}
<p class="crumbs"><a href="/">Workspaces</a> / <a href="{{.WS.Path}}">{{.WS.Name}}</a> /</p>
<h1>Members</h1>
<p class="muted">{{len .Members}} member{{if ne (len .Members) 1}}s{{end}}</p>
{{if .Members}}
<div class="scroll"><table class="list dense members">
<thead><tr><th>Name</th><th>Username</th><th>Role</th></tr></thead>
<tbody>{{range .Members}}<tr>
  <td><a href="{{$.WS.Path}}/members/{{.Username}}">{{.Name}}</a></td>
  <td class="muted">{{.Username}}</td>
  <td>{{if .IsAdmin}}Admin{{else}}User{{end}}{{if .Disabled}}, disabled{{end}}</td>
</tr>{{end}}</tbody>
</table></div>
{{end}}
{{end}}
