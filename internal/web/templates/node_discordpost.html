{{define "content"}}
<div class="modal-head"><h2>{{.Type.Label}}</h2><button class="close" type="button" data-close aria-label="Close">✕</button></div>
{{with .Error}}<p class="error">{{.}}</p>{{end}}
<form method="post" action="{{.Action}}" class="stack wide node-form step-form">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <input type="hidden" name="version" value="">
  <label>Name <input name="name" value="{{.Name}}" maxlength="60" required autocomplete="off"></label>
  <label><span class="lbl">Message <span class="info" tabindex="0" data-tip="Posted in the case's post in the workspace's Discord forum, opened if it has none. No pings, no link previews. A private repository's cases are never posted.">ⓘ</span></span>
    <textarea name="message" rows="6" class="code" spellcheck="false" required>{{.S.Message}}</textarea></label>
  {{template "tags" .}}
  <label class="check"><input type="checkbox" name="summary"{{if .S.Summary}} checked{{end}}> Update the summary <span class="info" tabindex="0" data-tip="Replaces the post's first message, which carries the case's summary of findings, instead of adding a message.">ⓘ</span></label>
  <div class="row"><button>Save</button><button type="button" class="secondary" data-close>Cancel</button></div>
</form>
{{end}}
